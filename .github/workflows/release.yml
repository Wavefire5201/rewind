name: release

# Tag a version to publish a GitHub Release with generated notes and a signed APK:
#   bun run version 1.1.0 && git commit -am "chore(release): 1.1.0"
#   git tag v1.1.0 && git push origin main v1.1.0
# The APK (rewind-v1.1.0.apk) is signed with the release key from the ANDROID_* secrets, so it
# installs over the previous release and keeps the app's data (see CONTRIBUTING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # The release key's certificate (public). An APK signed with anything else wouldn't install over
  # the previous release, so it's never published. Changes only if the key does: never, ideally.
  RELEASE_CERT_SHA256: b0942a8fdb8717a97556dcbc4051e939afb8040f5902ae83d3faca581c5a697b

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches app.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare the tag with the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG doesn't match app.json's version $version (bump with: bun run version x.y.z)"
            exit 1
          fi

  # Builds with a read-only token and no stored git credentials: dependency scripts and Gradle code
  # run here, next to the keystore, and never get a token that could write to the repo.
  apk:
    name: Signed release APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the native project
        run: bunx expo prebuild --platform android --no-install

      - name: Write the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret isn't set (see CONTRIBUTING.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build (arm64)
        working-directory: android
        env:
          REWIND_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.jks
          REWIND_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REWIND_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REWIND_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signature
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/rewind-$TAG.apk"
          scripts/check-apk-signature.sh "dist/rewind-$TAG.apk" "$RELEASE_CERT_SHA256"
          (cd dist && sha256sum "rewind-$TAG.apk" > "rewind-$TAG.apk.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/
          if-no-files-found: error

  # Only this job can write: it publishes what the build produced. The release stays a draft until
  # the APK is attached, so a failed build never leaves a release without one, and every step can
  # be re-run.
  publish:
    name: Publish release
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Create (as a draft), attach, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --draft
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
